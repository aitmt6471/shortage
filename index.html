<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <!-- viewport-fit=cover: 아이폰 노치/하단 바 영역까지 화면 사용 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1f3a5f">
    <title>자재결품 처리현황</title>
    <meta name="description" content="자재결품 등록 및 처리현황 관리">

    <!-- 앱 설치(홈 화면에 추가)용 -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="자재결품">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link rel="stylesheet" href="style.css?v=5">
</head>

<body>
    <!-- 헤더 -->
    <header class="header">
        <div class="header-bar">
            <span class="logo-wrap"><img src="ait-logo.png" alt="AIT" class="logo"></span>
            <h1>자재결품 처리현황</h1>
            <button type="button" class="icon-btn" id="refreshBtn" aria-label="새로고침" title="새로고침">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
            </button>
        </div>
        <!-- 건수 (누르면 처리현황 탭에서 해당 상태만 보기) -->
        <div class="summary">
            <button type="button" class="sum-card" data-filter=""><span>전체</span><strong id="cntAll">-</strong></button>
            <button type="button" class="sum-card wait" data-filter="대기"><span>대기</span><strong id="cntWait">-</strong></button>
            <button type="button" class="sum-card done" data-filter="완료"><span>완료</span><strong id="cntDone">-</strong></button>
        </div>
    </header>

    <!-- 탭: 핸드폰은 화면 아래, PC는 헤더 아래 -->
    <nav class="tabs">
        <button type="button" class="tab-btn active" data-tab="submit">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M12 8v8M8 12h8"/></svg>
            <span>결품 등록</span>
        </button>
        <button type="button" class="tab-btn" data-tab="status">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6h.01M4 12h.01M4 18h.01"/></svg>
            <span>처리현황</span>
            <em class="tab-badge hidden" id="tabWaitBadge"></em>
        </button>
    </nav>

    <main class="container">
        <div id="demoBanner" class="demo-banner hidden">
            데모 모드: 구글 시트가 연결되지 않아 이 기기에만 저장됩니다.
        </div>

        <!-- 결품 등록 -->
        <section id="submitSection" class="page">
            <form id="shortageForm" autocomplete="off">
                <div class="block">
                    <h2 class="block-title">작업 정보</h2>
                    <div class="row-2">
                        <div class="field">
                            <label for="writer">작성자</label>
                            <input type="text" id="writer" name="writer" placeholder="이름" enterkeyhint="next" required>
                        </div>
                        <div class="field">
                            <label for="line">사용라인</label>
                            <!-- 목록은 구글 시트의 '라인명' 시트에서 불러옴 -->
                            <select id="line" name="line" required>
                                <option value="">불러오는 중...</option>
                            </select>
                            <!-- 라인 목록을 못 불러왔을 때만 보이는 직접 입력 칸 -->
                            <input type="text" id="lineManual" class="hidden" placeholder="예: 1라인" enterkeyhint="next">
                        </div>
                    </div>
                </div>

                <div class="block">
                    <h2 class="block-title">자재</h2>
                    <div class="field suggest-wrap">
                        <label for="partNo">자재품번</label>
                        <div class="search-input">
                            <input type="text" id="partNo" name="partNo" placeholder="품번 2글자 이상 입력" autocapitalize="characters" enterkeyhint="next" required>
                            <button type="button" class="clear-btn hidden" id="clearPartNo" aria-label="품번 지우기">✕</button>
                        </div>
                        <ul id="partSuggest" class="suggest hidden"></ul>
                        <p id="lookupMsg" class="lookup-msg"></p>
                        <div id="finishedProductWrap" class="finished-product hidden" aria-live="polite">
                            <span class="finished-product-label">연결 완제품번호</span>
                            <span id="finishedProductNos" class="finished-product-nos"></span>
                        </div>
                    </div>

                    <!-- 품번으로 자동 입력되는 영역 -->
                    <div class="auto-box">
                        <div class="auto-row">
                            <label for="partName">품명</label>
                            <input type="text" id="partName" name="partName" placeholder="자동 입력" readonly required>
                        </div>
                        <div class="auto-row">
                            <label for="vendor">업체</label>
                            <input type="text" id="vendor" name="vendor" list="vendorList" placeholder="자동 입력" readonly required>
                            <datalist id="vendorList"></datalist>
                        </div>
                        <div class="auto-row">
                            <label for="manager">담당자</label>
                            <input type="text" id="manager" name="manager" placeholder="자동 입력" readonly required>
                        </div>
                        <label class="check hidden" id="saveMasterWrap">
                            <input type="checkbox" id="saveMaster" checked>
                            <span>자재마스터 / 업체담당자 시트에도 저장</span>
                        </label>
                    </div>
                </div>

                <div class="block">
                    <h2 class="block-title">수량 · 비고</h2>
                    <div class="field">
                        <label for="qty">필요수량 (EA)</label>
                        <div class="stepper">
                            <button type="button" class="step-btn" data-step="-1" aria-label="1 빼기">−</button>
                            <input type="number" id="qty" name="qty" min="1" step="1" inputmode="numeric" placeholder="0" required>
                            <button type="button" class="step-btn" data-step="1" aria-label="1 더하기">+</button>
                        </div>
                    </div>
                    <div class="field">
                        <label for="note">비고</label>
                        <textarea id="note" name="note" rows="2" placeholder="특이사항 (선택)"></textarea>
                    </div>
                </div>

                <!-- 핸드폰: 화면 아래 탭 위에 고정 -->
                <div class="submit-bar">
                    <button type="submit" class="submit-btn">
                        <span class="btn-text">등록하기</span>
                        <span class="loader" style="display: none;"></span>
                    </button>
                </div>
            </form>
        </section>

        <!-- 처리현황 -->
        <section id="statusSection" class="page hidden">
            <div class="toolbar">
                <div class="search-input">
                    <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                    <input type="search" id="search" placeholder="품번 · 품명 · 업체 · 담당자 · 라인 · 작성자">
                </div>
                <div class="toolbar-row">
                    <div class="segment" id="filter" role="tablist">
                        <button type="button" class="seg-btn active" data-filter="">전체</button>
                        <button type="button" class="seg-btn" data-filter="대기">대기</button>
                        <button type="button" class="seg-btn" data-filter="완료">완료</button>
                    </div>
                    <button type="button" class="btn" id="exportBtn">엑셀 저장</button>
                </div>
            </div>

            <!-- 핸드폰: 카드 목록 / PC: 표 -->
            <div id="recordList" class="record-list"></div>
            <div class="table-wrap">
                <table class="records-table">
                    <thead>
                        <tr>
                            <th>등록일시</th>
                            <th>작성자</th>
                            <th>사용라인</th>
                            <th>자재품번</th>
                            <th>품명</th>
                            <th>업체</th>
                            <th>담당자</th>
                            <th class="num">필요수량</th>
                            <th>입고일정</th>
                            <th>처리현황</th>
                            <th>비고</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="recordsTableBody"></tbody>
                </table>
            </div>
            <p class="no-records hidden" id="noRecords">해당하는 결품 내역이 없습니다.</p>
            <p class="hint">상태 버튼을 누르면 대기 ↔ 완료로 바뀌고, 입고일정(달력)과 비고는 바로 고칠 수 있습니다.</p>
        </section>
    </main>

    <!-- 알림 (화면 아래에 잠깐 표시) -->
    <div id="notification" class="toast hidden" role="status">
        <p id="notificationMessage"></p>
    </div>

    <!-- 등록 확인 (핸드폰: 아래에서 올라오는 창) -->
    <div id="confirmModal" class="modal hidden">
        <div class="modal-content">
            <div class="sheet-handle"></div>
            <h2>등록 내용 확인</h2>
            <div class="confirm-details" id="confirmDetails"></div>
            <div class="modal-actions">
                <button type="button" class="btn" id="cancelSubmit">취소</button>
                <button type="button" class="btn primary" id="confirmSubmit">등록</button>
            </div>
        </div>
    </div>

    <!-- 삭제 확인 -->
    <div id="deleteModal" class="modal hidden">
        <div class="modal-content">
            <div class="sheet-handle"></div>
            <h2>내역 삭제</h2>
            <p class="modal-description" id="deleteDescription">정말 삭제하시겠습니까?</p>
            <div class="modal-actions">
                <button type="button" class="btn" id="deleteNo">아니오</button>
                <button type="button" class="btn danger" id="deleteYes">삭제</button>
            </div>
        </div>
    </div>

    <script src="script.js?v=5"></script>
</body>

</html>
